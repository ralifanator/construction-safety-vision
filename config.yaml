# ========================
# Настройки моделей YOLO
# ========================
models:
  # Модель детекции людей.
  person_detector:
    # Путь к файлу весов модели детекции людей.
    # Можно указать относительный (относительно папки проекта) или абсолютный путь.
    path: "models/yolov8s.pt"

    # Минимальный порог уверенности (confidence) для учёта детекций.
    # Детекции с меньшим значением будут отбрасываться.
    confidence_threshold: 0.5

    # Порог IoU для NMS (non-maximum suppression) внутри модели.
    # Чем выше порог — тем больше перекрывающиеся боксы останутся.
    nms_iou_threshold: 0.45

  # Модель детекции средств индивидуальной защиты (каски, жилеты, головы).
  ppe_detector:
    # Путь к файлу весов обученной модели касок/жилетов.
    path: "models/best.pt"

    # Минимальный порог уверенности для учёта детекций касок/жилетов.
    confidence_threshold: 0.5

    # Порог IoU для NMS в модели СИЗ.
    nms_iou_threshold: 0.45


# ==========================================
# Логика сопоставления касок/жилетов и людей
# ==========================================
detection_logic:
  # Порог IoU для "привязки" каски или жилета к человеку.
  # Если пересечение bbox каски/жилета и bbox человека >= этого порога,
  # считаем, что данная каска/жилет принадлежат этому человеку.
  helmet_vest_match_iou_threshold: 0.3

  # Порог уверенности для касок
  helmet_confidence_threshold: 0.7

  # Порог уверенности для жилетов
  vest_confidence_threshold: 0.5

  # Порог уверенности для людей
  person_confidence_threshold: 0.4

  # Минимальная площадь bbox человека (в пикселях).
  # Детекции людей с меньшей площадью можно считать шумом (слишком далеко или артефакты).
  # Помогает отсеять очень маленьких "людей" на фоне.
  person_min_area: 500

# =====================
# Настройки обработки видео
# =====================
video_processing:
  # Целевая частота анализа кадров (кадров/секунда).
  # Например, 1.0 означает ~1 анализируемый кадр в секунду видеопотока.
  target_fps: 2.0

  # Максимальная ширина кадра перед анализом.
  # Если кадр шире этого значения, он будет пропорционально уменьшен по ширине.
  # Это снижает нагрузку на процессор и ускоряет работу нейросети.
  max_width: 1024

stability:
  # Размер окна по кадрам для видеоанализа (сколько последних кадров учитываем).
  window_size_n: 10

  # Порог доли кадров с нарушениями в окне (0..1).
  # Например, 0.6 означает: нарушение считается устойчивым,
  # если в окне как минимум 60% кадров с нарушениями.
  violation_ratio_t: 0.6

  # Минимальное число кадров в истории конкретного человека,
  # при котором вообще можно фиксировать устойчивое нарушение.
  # Пока история короче этого значения, нарушение считается недостаточно устойчивым.
  min_window_for_violation: 3

tracking:
  # Порог IoU для сопоставления людей между кадрами (0..1).
  iou_threshold: 0.3

  # Максимальное число анализируемых кадров, в течение которых трек
  # может не обновляться, прежде чем будет удалён.
  max_track_lost_frames: 50

stream:
  max_run_duration_sec: 3600